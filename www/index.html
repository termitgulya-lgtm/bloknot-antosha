    header {
      padding: 18px 24px;
      background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid rgba(255, 255, 255, .55);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 { font-size: 21px; margin: 0; }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      background: #edf1f4;
      color: var(--ink);
    }

    button:hover { filter: brightness(.97); }
    button.primary { background: var(--accent); color: white; }
    button.active { background: var(--accent-light); color: var(--accent); }
    button.danger { color: var(--danger); background: #fff0ef; }
    button.small { padding: 6px 9px; font-size: 13px; }

    main {
      max-width: 1200px;
      padding: 24px;
      margin: auto;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h2 { margin: 0; font-size: 22px; }
    h3 { margin: 0 0 12px; font-size: 17px; }
    .muted { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .table-card {
      text-align: left;
      cursor: pointer;
      min-height: 0;
      padding: 10px;
    }

    .table-card.selected {
      border: 2px solid var(--accent);
      padding: 9px;
    }

    /* Свободные столы — зелёные */
    .table-card:not(.has-order) {
      background: #d8f0e2;
      border-color: #2d8a61;
      box-shadow: inset 0 0 0 1px #2d8a61;
    }

    .table-card:not(.has-order) .badge {
      color: #176b53;
      background: #c7e8d5;
    }

    .table-card:not(.has-order) .actions button {
      background-color: #c7e8d5;
    }

    /* Занятые столы — красные */
    .table-card.has-order {
      background: #fde2e1;
      border-color: #d92d20;
      box-shadow: inset 0 0 0 1px #d92d20;
    }

    .table-card.has-order .badge {
      color: #b42318;
      background: #fecdca;
    }

    .table-card.has-order .actions button {
      background-color: #fecdca;
    }

    .table-name { font-size: 16px; font-weight: 750; }

    .badge {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      background: var(--accent-light);
      padding: 4px 8px;
      border-radius: 20px;
      margin-top: 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr);
      gap: 18px;
    }

    .menu-row, .order-row, .archive-row, .category-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .menu-row:last-child, .order-row:last-child,
    .archive-row:last-child, .category-row:last-child {
      border-bottom: 0;
    }

    .item-title { font-weight: 650; }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .price, .total {
      font-weight: 750;
      white-space: nowrap;
    }

    .total { font-size: 20px; }

    .section-title {
      margin: 20px 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    .section-title:first-child { margin-top: 0; }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 32px 16px;
      background: var(--card);
      border: 1px dashed #cbd4dc;
      border-radius: 14px;
    }

    .order-footer {
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .archive-details {
      margin-top: 12px;
      padding: 14px;
      background: #f7f9fa;
      border-radius: 10px;
    }

    .archive-details p { margin: 6px 0; }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .category-name {
      color: #b42318;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .collapsible-header {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collapsible-header:hover {
      color: var(--accent);
    }

    /* Окно изменения номера стола */
    .rename-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #0006;
    }

    .rename-dialog {
      width: 100%;
      max-width: 380px;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      padding: 20px;
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 8px 30px #0003;
    }

    .rename-dialog h3 {
      margin: 0 0 14px;
    }

    .rename-dialog input {
      display: block;
      width: 100%;
      min-height: 46px;
      margin-bottom: 16px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      background: white;
    }

    .rename-dialog input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .rename-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Универсальные окна ввода для мобильных устройств */
    .form-dialog-fields {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-dialog-field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 650;
    }

    .form-dialog-field input,
    .form-dialog-field select {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      background: white;
    }

    .form-dialog-field input:focus,
    .form-dialog-field select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    /* Кнопка скрытия мобильной клавиатуры */
    .keyboard-done {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 9999;
      background: var(--accent);
      color: white;
      padding: 13px 22px;
      border-radius: 12px;
      box-shadow: 0 4px 18px #0003;
      font-size: 15px;
    }

    @media (max-width: 760px) {
      main { padding: 12px; }
      header { padding: 12px; }
      .layout { grid-template-columns: 1fr; }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        gap: 6px;
      }

      .table-card {
        min-height: 0;
        padding: 7px 8px;
        border-radius: 10px;
      }

      .table-card.selected { padding: 6px 7px; }

      .table-name {
        font-size: 14px;
        line-height: 1.2;
      }

      .table-card .badge {
        margin-top: 5px;
        padding: 3px 6px;
        font-size: 10px;
      }

      .table-card .actions {
        margin-top: 6px !important;
        gap: 4px;
      }

      .table-card .actions button {
        padding: 4px 6px;
        font-size: 11px;
        border-radius: 7px;
      }

      body.keyboard-open .keyboard-done {
        display: block;
      }

      body.keyboard-open {
        padding-bottom: 65px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Блокнот официанта</h1>
    <nav>
      <button id="nav-tables" onclick="setView('tables')">Столы и заказы</button>
      <button id="nav-menu" onclick="setView('menu')">Меню</button>
      <button id="nav-archive" onclick="setView('archive')">Архив</button>
    </nav>
  </header>

  <main id="app"></main>

  <!-- Кнопка закрытия мобильной клавиатуры -->
  <button type="button" class="keyboard-done" id="keyboardDone">
    ✓ Готово
  </button>

  <script>
    const STORAGE_KEY = "waiter-notebook-v1";

    function emptyState() {
      return {
        tables: [],
        categories: [],
        menu: [],
        orders: {},
        archive: []
      };
    }

    let state;

    try {
      state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || emptyState();
    } catch {
      state = emptyState();
    }

    // Совместимость со старыми данными
    Object.keys(state.orders || {}).forEach(tableId => {
      const saved = state.orders[tableId];

      if (!saved.bills) {
        const bill = {
          id: makeId(),
          name: "Счёт 1",
          items: (saved.items || []).map(item => ({
            ...item,
            comment: item.comment || ""
          })),
          comment: saved.comment || ""
        };

        state.orders[tableId] = {
          bills: [bill],
          activeBillId: bill.id
        };
      }
    });

    Object.values(state.orders || {}).forEach(tableOrder => {
      (tableOrder.bills || []).forEach(bill => {
        bill.items = (bill.items || []).map(item => ({
          ...item,
          comment: item.comment || ""
        }));
      });
    });

    let view = "tables";
    let selectedTableId = null;
    let expandedCategoryId = state.categories[0]?.id || null;

    function toggleCategory(id) {
      expandedCategoryId = expandedCategoryId === id ? null : id;
      render();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function makeId() {
      return Date.now().toString(36) +
        Math.random().toString(36).slice(2, 8);
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function money(value) {
      return new Intl.NumberFormat("ru-RU", {
        style: "currency",
        currency: "UAH",
        maximumFractionDigits: 2
      }).format(value);
    }

    function setView(nextView) {
      view = nextView;
      render();
    }

    function addTable() {
      const usedNumbers = new Set(
        state.tables.map(t => String(t.number).trim().toLowerCase())
      );

      let number = 1;
      while (usedNumbers.has(String(number))) number++;

      const table = {
        id: makeId(),
        number: String(number)
      };

      state.tables.push(table);
      selectedTableId = table.id;
      expandedCategoryId = null;

      save();
      render();
    }

    function getTableBills(tableId) {
      if (!state.orders[tableId]) {
        state.orders[tableId] = {
          bills: [],
          activeBillId: null
        };
      }

      return state.orders[tableId].bills;
    }

    function getActiveBill(tableId) {
      const bills = getTableBills(tableId);
      const tableOrder = state.orders[tableId];

      return bills.find(b => b.id === tableOrder.activeBillId)
        || bills[0]
        || null;
    }

    function addBill(tableId) {
      const bills = getTableBills(tableId);

      const bill = {
        id: makeId(),
        name: `Счёт ${bills.length + 1}`,
        items: [],
        comment: ""
      };

      bills.push(bill);
      state.orders[tableId].activeBillId = bill.id;

      save();
      render();
    }

    function selectBill(tableId, billId) {
      if (!state.orders[tableId]?.bills?.some(b => b.id === billId)) {
        return;
      }

      state.orders[tableId].activeBillId = billId;
      save();
      render();
    }

    function updateOrderComment(tableId, billId, value) {
      const bill = getTableBills(tableId).find(b => b.id === billId);
      if (!bill) return;

      bill.comment = value;
      save();
    }

    function renameTable(id) {
      const table = state.tables.find(t => t.id === id);
      if (!table) return;

      // Закрываем ранее открытое окно, если оно осталось на экране.
      document.querySelector(".rename-overlay")?.remove();

      const overlay = document.createElement("div");
      overlay.className = "rename-overlay";
      overlay.innerHTML = `
        <div class="rename-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="renameTableTitle">

          <h3 id="renameTableTitle">Изменить номер стола</h3>

          <input
            id="renameTableInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            aria-label="Новый номер стола"
            value="${esc(table.number)}"
          >

          <div class="rename-actions">
            <button type="button" id="renameTableCancel">Отмена</button>
            <button type="button" class="primary" id="renameTableSave">
              Сохранить
            </button>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      const input = overlay.querySelector("#renameTableInput");
      const cancelButton = overlay.querySelector("#renameTableCancel");
      const saveButton = overlay.querySelector("#renameTableSave");

      function closeDialog() {
        input.blur();
        overlay.remove();
        document.body.classList.remove("keyboard-open");
      }

      function saveTableNumber() {
        const number = input.value.trim();

        if (!number) {
          alert("Введите номер стола.");
          input.focus();
          return;
        }

        const duplicate = state.tables.some(t =>
          t.id !== id &&
          String(t.number).trim().toLowerCase() === number.toLowerCase()
        );

        if (duplicate) {
          alert("Стол с таким номером уже существует.");
          input.focus();
          input.select();
          return;
        }

        table.number = number;
        save();
        closeDialog();
        render();
      }

      cancelButton.addEventListener("click", closeDialog);
      saveButton.addEventListener("click", saveTableNumber);

      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          saveTableNumber();
        }

        if (event.key === "Escape") {
          event.preventDefault();
          closeDialog();
        }
      });

      overlay.addEventListener("click", event => {
        if (event.target === overlay) closeDialog();
      });

      // Небольшая задержка нужна мобильным браузерам для корректного фокуса.
      requestAnimationFrame(() => {
        input.focus();
        input.select();
      });
    }

    function deleteTable(id) {
      const table = state.tables.find(t => t.id === id);
      if (!table) return;

      if (state.orders[id]?.bills?.some(b => b.items?.length)) {
        alert("Нельзя удалить стол, пока для него есть незавершённые счета.");
        return;
      }

      if (!confirm(`Удалить стол №${table.number}?`)) return;

      state.tables = state.tables.filter(t => t.id !== id);
      delete state.orders[id];

      if (selectedTableId === id) selectedTableId = null;

      save();
      render();
    }

    // Универсальное окно ввода вместо системного prompt().
    // После сохранения/отмены поле теряет фокус, поэтому мобильная
    // клавиатура закрывается вместе с окном.
    function showFormDialog({ title, fields, saveLabel = "Сохранить", onSave }) {
      document.querySelector(".form-dialog-overlay")?.remove();

      const overlay = document.createElement("div");
      overlay.className = "rename-overlay form-dialog-overlay";

      const fieldMarkup = fields.map((field, index) => {
        const id = `formDialogField${index}`;
        const label = esc(field.label);
        if (field.type === "select") {
          const options = (field.options || []).map(option =>
            `<option value="${esc(option.value)}"${
              String(option.value) === String(field.value) ? " selected" : ""
            }>${esc(option.label)}</option>`
          ).join("");

          return `
            <div class="form-dialog-field">
              <label for="${id}">${label}</label>
              <select id="${id}" name="${esc(field.name || id)}">
                ${options}
              </select>
            </div>
          `;
        }

        return `
          <div class="form-dialog-field">
            <label for="${id}">${label}</label>
            <input
              id="${id}"
              name="${esc(field.name || id)}"
              type="${field.type === "number" ? "number" : "text"}"
              ${field.type === "number" ? 'inputmode="decimal" step="any" min="0"' : 'inputmode="text"'}
              autocomplete="off"
              value="${esc(field.value ?? "")}"
              ${field.required === false ? "" : "required"}
            >
          </div>
        `;
      }).join("");

      overlay.innerHTML = `
        <div class="rename-dialog" role="dialog" aria-modal="true">
          <h3>${esc(title)}</h3>
          <form id="formDialogForm">
            <div class="form-dialog-fields">${fieldMarkup}</div>
            <div class="rename-actions">
              <button type="button" id="formDialogCancel">Отмена</button>
              <button type="submit" class="primary">${esc(saveLabel)}</button>
            </div>
          </form>
        </div>
      `;

      document.body.appendChild(overlay);

      const form = overlay.querySelector("#formDialogForm");
      const cancelButton = overlay.querySelector("#formDialogCancel");
      const controls = [...overlay.querySelectorAll("input, select")];

      function closeDialog() {
        controls.forEach(control => control.blur());
        if (document.activeElement?.blur) document.activeElement.blur();
        overlay.remove();
        document.body.classList.remove("keyboard-open");
      }

      function submitDialog(event) {
        event.preventDefault();

        const values = controls.map(control => control.value.trim());

        for (let i = 0; i < fields.length; i++) {
          if (fields[i].required !== false && !values[i]) {
            alert(`Заполните поле «${fields[i].label}».`);
            controls[i].focus();
            return;
          }
        }

        const result = {};
        fields.forEach((field, index) => {
          result[field.name || `field${index}`] = values[index];
        });

        // Сначала закрываем окно и клавиатуру, затем обновляем интерфейс.
        closeDialog();
        onSave(result);
      }

      form.addEventListener("submit", submitDialog);
      cancelButton.addEventListener("click", closeDialog);

      overlay.addEventListener("click", event => {
        if (event.target === overlay) closeDialog();
      });

      overlay.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeDialog();
        }
      });

      // Небольшая задержка помогает мобильным браузерам правильно
      // открыть клавиатуру уже после появления окна.
      requestAnimationFrame(() => {
        const firstInput = controls.find(control => control.tagName === "INPUT");
        if (firstInput) {
          firstInput.focus();
          firstInput.select?.();
        }
      });
    }

    function addCategory() {
      showFormDialog({
        title: "Новая категория",
        fields: [
          { name: "name", label: "Название категории", type: "text" }
        ],
        onSave: ({ name }) => {
          state.categories.push({
            id: makeId(),
            name
          });
          expandedCategoryId = state.categories[state.categories.length - 1].id;
          save();
          render();
        }
      });
    }

    function renameCategory(id) {
      const category = state.categories.find(c => c.id === id);
      if (!category) return;

      showFormDialog({
        title: "Изменить категорию",
        fields: [
          { name: "name", label: "Название категории", type: "text", value: category.name }
        ],
        onSave: ({ name }) => {
          category.name = name;
          save();
          render();
        }
      });
    }

    function deleteCategory(id) {
      const used = state.menu.some(item => item.categoryId === id);

      if (used) {
        alert("Сначала переместите или удалите блюда из этой категории.");
        return;
      }

      if (!confirm("Удалить категорию?")) return;

      state.categories = state.categories.filter(c => c.id !== id);
      if (expandedCategoryId === id) {
        expandedCategoryId = state.categories[0]?.id || null;
      }
      save();
      render();
    }

    function addMenuItem(categoryId) {
      if (!state.categories.length) {
        alert("Сначала создайте категорию.");
        return;
      }

      const categoryOptions = state.categories.map(category => ({
        value: category.id,
        label: category.name
      }));

      const initialCategoryId = categoryId && state.categories.some(c => c.id === categoryId)
        ? categoryId
        : state.categories[0].id;

      showFormDialog({
        title: "Новая позиция меню",
        fields: [
          { name: "name", label: "Название блюда или напитка", type: "text" },
          { name: "price", label: "Цена (грн)", type: "number" },
          {
            name: "categoryId",
            label: "Категория",
            type: "select",
            value: initialCategoryId,
            options: categoryOptions
          }
        ],
        onSave: ({ name, price: rawPrice, categoryId: selectedCategoryId }) => {
          const price = Number(rawPrice.replace(",", "."));

          if (!Number.isFinite(price) || price < 0) {
            alert("Введите корректную цену.");
            addMenuItem(selectedCategoryId);
            return;
          }

          state.menu.push({
            id: makeId(),
            name,
            price,
            categoryId: selectedCategoryId
          });

          expandedCategoryId = selectedCategoryId;
          save();
          render();
        }
      });
    }

    function editMenuItem(id) {
      const item = state.menu.find(i => i.id === id);
      if (!item) return;

      const categoryOptions = state.categories.map(category => ({
        value: category.id,
        label: category.name
      }));

      showFormDialog({
        title: "Редактировать позицию",
        fields: [
          { name: "name", label: "Название", type: "text", value: item.name },
          { name: "price", label: "Цена (грн)", type: "number", value: String(item.price) },
          {
            name: "categoryId",
            label: "Категория",
            type: "select",
            value: item.categoryId,
            options: categoryOptions
          }
        ],
        onSave: ({ name, price: rawPrice, categoryId }) => {
          const price = Number(rawPrice.replace(",", "."));

          if (!Number.isFinite(price) || price < 0) {
            alert("Введите корректную цену.");
            editMenuItem(id);
            return;
          }

          item.name = name;
          item.price = price;
          item.categoryId = categoryId;
          expandedCategoryId = categoryId;

          save();
          render();
        }
      });
    }

    function deleteMenuItem(id) {
      if (!confirm("Удалить позицию из меню?")) return;

      state.menu = state.menu.filter(i => i.id !== id);
      save();
      render();
    }

    function addToOrder(tableId, menuItemId) {
      const item = state.menu.find(i => i.id === menuItemId);
      if (!item) return;

      let order = getActiveBill(tableId);

      if (!order) {
        addBill(tableId);
        order = getActiveBill(tableId);
      }

      const existing = order.items.find(i => i.menuItemId === item.id);

      if (existing) {
        existing.qty += 1;
      } else {
        order.items.push({
          menuItemId: item.id,
          name: item.name,
          price: item.price,
          qty: 1
        });
      }

      save();
      render();
    }

    function updateItemComment(tableId, billId, index, value) {
      const bill = getTableBills(tableId).find(b => b.id === billId);
      const item = bill?.items?.[index];

      if (!item) return;

      item.comment = value;
      save();
    }

    function changeQty(tableId, index, change) {
      const order = getActiveBill(tableId);
      if (!order) return;

      const item = order.items[index];
      if (!item) return;

      item.qty += change;

      if (item.qty <= 0) {
        order.items.splice(index, 1);
      }

      save();
      render();
    }

    async function shareOrder(tableId) {
      const table = state.tables.find(t => t.id === tableId);
      const order = getActiveBill(tableId);

      if (!table || !order || !order.items?.length) {
        alert("В этом счёте пока нет позиций для отправки.");
        return;
      }

      const lines = [
        `Заказ — стол №${table.number}`,
        order.name || "Счёт",
        ""
      ];

      order.items.forEach(item => {
        const lineTotal = item.price * item.qty;
        lines.push(
          `${item.name} — ${item.qty} × ${money(item.price)} = ${money(lineTotal)}`
        );
        if (item.comment?.trim()) {
          lines.push(`  Комментарий: ${item.comment.trim()}`);
        }
      });

      if (order.comment?.trim()) {
        lines.push("", `Комментарий к счёту: ${order.comment.trim()}`);
      }

      const total = order.items.reduce(
        (sum, item) => sum + item.price * item.qty,
        0
      );
      lines.push("", `ИТОГО: ${money(total)}`);

      const message = lines.join("\n");
      const title = `Заказ — стол №${table.number}`;

      if (navigator.share) {
        try {
          await navigator.share({ title, text: message });
          return;
        } catch (error) {
          // Отмена пользователем — нормальный сценарий, ничего не делаем.
          if (error?.name === "AbortError") return;
          // При ошибке системного меню пробуем скопировать текст.
        }
      }

      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(message);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = message;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          const copied = document.execCommand("copy");
          textarea.remove();
          if (!copied) throw new Error("Не удалось скопировать текст");
        }
        alert("Текст заказа скопирован. Его можно вставить в мессенджер.");
      } catch {
        // Последний резервный вариант для браузеров с ограниченным доступом
        // к буферу обмена.
        prompt("Скопируйте текст заказа:", message);
      }
    }

    function finishOrder(tableId) {
      const order = getActiveBill(tableId);
      const table = state.tables.find(t => t.id === tableId);

      if (!order?.items?.length || !table) return;

      if (!confirm(
        `Завершить ${order.name.toLowerCase()} для стола №${table.number}?`
      )) return;

      state.archive.unshift({
        id: makeId(),
        tableNumber: table.number,
        billName: order.name,
        finishedAt: new Date().toISOString(),
        items: order.items.map(i => ({ ...i })),
        comment: order.comment || "",
        total: order.items.reduce(
          (sum, i) => sum + i.price * i.qty,
          0
        )
      });

      const tableOrder = state.orders[tableId];

      tableOrder.bills = tableOrder.bills.filter(b => b.id !== order.id);

      if (tableOrder.bills.length) {
        tableOrder.activeBillId = tableOrder.bills[0].id;
      } else {
        delete state.orders[tableId];
      }

      save();
      render();
    }

    function renderTables() {
      const selected = state.tables.find(t => t.id === selectedTableId);

      const tableCards = state.tables.length
        ? `<div class="grid">${state.tables.map(t => {
            const hasOrder = state.orders[t.id]?.bills?.some(
              b => b.items?.length
            );

            return `<div class="card table-card ${
              hasOrder ? "has-order" : ""
            } ${t.id === selectedTableId ? "selected" : ""}"
              onclick="selectedTableId='${t.id}';expandedCategoryId=null;render()">

              <div class="table-name">Стол №${esc(t.number)}</div>
              <div class="badge">${hasOrder ? "Есть заказ" : "Свободен"}</div>

              <div class="actions" style="margin-top:12px"
                onclick="event.stopPropagation()">
                <button class="small" onclick="renameTable('${t.id}')">
                  Изменить
                </button>
                <button class="small danger" onclick="deleteTable('${t.id}')">
                  Удалить
                </button>
              </div>
            </div>`;
          }).join("")}</div>`
        : `<div class="empty">
            Столов пока нет. Нажмите «Добавить стол», чтобы начать.
          </div>`;

      let orderPanel = `
        <div class="empty">Выберите стол, чтобы открыть заказ.</div>
      `;

      if (selected) {
        const bills = getTableBills(selected.id);

        if (!bills.length) {
          const firstBill = {
            id: makeId(),
            name: "Счёт 1",
            items: [],
            comment: ""
          };

          bills.push(firstBill);
          state.orders[selected.id].activeBillId = firstBill.id;
          save();
        }

        const order = getActiveBill(selected.id);

        const billTabs = `
          <div class="actions" style="margin:10px 0 14px">
            ${bills.map(bill => `
              <button class="small ${
                bill.id === order.id ? "active" : ""
              }" onclick="selectBill('${selected.id}','${bill.id}')">
                ${esc(bill.name)}${
                  bill.items.length
                    ? ` · ${bill.items.reduce((n, i) => n + i.qty, 0)}`
                    : ""
                }
              </button>
            `).join("")}

            <button class="small primary" onclick="addBill('${selected.id}')">
              ＋ Новый счёт
            </button>
          </div>
        `;

        const orderItems = order.items.map((item, index) => `
          <div class="order-row">
            <div>
              <div class="item-title">${esc(item.name)}</div>
              <div class="muted">${money(item.price)} за шт.</div>

              <input
                type="text"
                value="${esc(item.comment || "")}"
                placeholder="Комментарий к блюду..."
                aria-label="Комментарий к блюду ${esc(item.name)}"
                style="display:block;width:100%;max-width:260px;margin-top:6px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px"
                oninput="updateItemComment('${selected.id}', '${order.id}', ${index}, this.value)"
              >
            </div>

            <div class="item-actions">
              <button class="small" onclick="changeQty('${selected.id}',${index},-1)">−</button>
              <strong>${item.qty}</strong>
              <button class="small" onclick="changeQty('${selected.id}',${index},1)">+</button>
              <strong>${money(item.price * item.qty)}</strong>
            </div>
          </div>
        `).join("");

        const menuSections = state.categories
          .slice()
          .sort((a, b) => a.name.localeCompare(b.name, "ru", { sensitivity: "base" }))
          .map(category => {
          const items = state.menu
            .filter(i => i.categoryId === category.id)
            .sort((a, b) => a.name.localeCompare(b.name, "ru", { sensitivity: "base" }));

          if (!items.length) return "";

          const isCollapsed = expandedCategoryId !== category.id;

          return `
            <div class="section-title collapsible-header"
              onclick="toggleCategory('${category.id}')">
              <span>${isCollapsed ? "▸" : "▾"}</span>
              <span><span class="category-name">${esc(category.name)}</span> (${items.length})</span>
            </div>

            ${isCollapsed ? "" : items.map(item => `
              <div class="menu-row">
                <div>
                  <div class="item-title">${esc(item.name)}</div>
                  <div class="muted">${money(item.price)}</div>
                </div>

                <button class="primary small"
                  onclick="addToOrder('${selected.id}','${item.id}')">
                  Добавить
                </button>
              </div>
            `).join("")}
          `;
        }).join("");

        const total = order.items.reduce(
          (sum, i) => sum + i.price * i.qty,
          0
        );

        orderPanel = `
          <div class="layout">
            <section class="card">
              <h3>Меню</h3>
              ${menuSections ||
                `<p class="muted">Добавьте категории и позиции в разделе «Меню».</p>`
              }
            </section>

            <section class="card">
              <h3>Заказ — стол №${esc(selected.number)}</h3>

              ${billTabs}

              <div class="muted" style="font-size:13px;margin-bottom:8px">
                ${esc(order.name)}
              </div>

              ${orderItems ||
                `<p class="muted">В этом счёте пока нет позиций.</p>`
              }

              <div class="order-footer">
                <div>
                  <div class="muted">Итого</div>
                  <div class="total">${money(total)}</div>
                </div>

                <div class="actions">
                  <button
                    onclick="shareOrder('${selected.id}')"
                    ${order.items.length ? "" : "disabled"}>
                    Поделиться заказом
                  </button>
                  <button class="primary"
                    onclick="finishOrder('${selected.id}')"
                    ${order.items.length ? "" : "disabled"}>
                    Завершить
                  </button>
                </div>
              </div>
            </section>
          </div>
        `;
      }

      return `
        <div class="toolbar">
          <h2>Столы и заказы</h2>
          <button class="primary" onclick="addTable()">＋ Добавить стол</button>
        </div>

        ${tableCards}
        <div style="height:20px"></div>
        ${orderPanel}
      `;
    }

    function renderMenu() {
      const categories = state.categories
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name, "ru", { sensitivity: "base" }))
        .map(category => {
        const items = state.menu
          .filter(i => i.categoryId === category.id)
          .sort((a, b) => a.name.localeCompare(b.name, "ru", { sensitivity: "base" }));

        const isCollapsed = expandedCategoryId !== category.id;

        return `
          <section class="card" style="margin-bottom:14px">
            <div class="toolbar"
              style="margin-bottom:${isCollapsed ? "0" : "8px"}">

              <h3 class="collapsible-header"
                style="margin:0"
                onclick="toggleCategory('${category.id}')">

                <span>${isCollapsed ? "▸" : "▾"}</span>
                <span>
                  <span class="category-name">${esc(category.name)}</span>
                  <span class="muted">(${items.length})</span>
                </span>
              </h3>

              <div class="actions">
                <button class="small"
                  onclick="addMenuItem('${category.id}')">
                  ＋ Позиция
                </button>

                <button class="small"
                  onclick="renameCategory('${category.id}')">
                  Изменить
                </button>

                <button class="small danger"
                  onclick="deleteCategory('${category.id}')">
                  Удалить
                </button>
              </div>
            </div>

            ${isCollapsed ? "" : (
              items.length
                ? items.map(item => `
                    <div class="menu-row">
                      <div>
                        <div class="item-title">${esc(item.name)}</div>
                        <div class="muted">${money(item.price)}</div>
                      </div>

                      <div class="actions">
                        <button class="small"
                          onclick="editMenuItem('${item.id}')">
                          Редактировать
                        </button>

                        <button class="small danger"
                          onclick="deleteMenuItem('${item.id}')">
                          Удалить
                        </button>
                      </div>
                    </div>
                  `).join("")
                : `<p class="muted">В этой категории пока нет позиций.</p>`
            )}
          </section>
        `;
      }).join("");

      return `
        <div class="toolbar">
          <h2>Меню</h2>

          <div class="actions">
            <button class="primary" onclick="addCategory()">
              ＋ Категория
            </button>

            <button onclick="addMenuItem()">
              ＋ Позиция меню
            </button>
          </div>
        </div>

        ${categories ||
          `<div class="empty">
            Категорий пока нет. Создайте категорию, затем добавьте блюда и цены.
          </div>`
        }
      `;
    }

    function renderArchive() {
      if (!state.archive.length) {
        return `
          <div class="toolbar">
            <h2>Архив заказов</h2>
          </div>

          <div class="empty">
            Завершённых заказов пока нет.
          </div>
        `;
      }

      return `
        <div class="toolbar">
          <h2>Архив заказов</h2>
        </div>

        ${state.archive.map((order, index) => {
          const date = new Date(order.finishedAt);

          const dateText = new Intl.DateTimeFormat("ru-RU", {
            dateStyle: "short",
            timeStyle: "short"
          }).format(date);

          return `
            <details class="card" style="margin-bottom:12px">
              <summary style="cursor:pointer;font-weight:700">
                Стол №${esc(order.tableNumber)}
                ${order.billName ? ` · ${esc(order.billName)}` : ""}
                · ${dateText} · ${money(order.total)}
              </summary>

              <div class="archive-details">
                ${order.items.map(i => `
                  <p>
                    ${esc(i.name)} — ${i.qty} × ${money(i.price)}
                    = <strong>${money(i.qty * i.price)}</strong>

                    ${i.comment
                      ? `<br><span class="muted">Комментарий: ${esc(i.comment)}</span>`
                      : ""
                    }
                  </p>
                `).join("")}

                <p><strong>Итого: ${money(order.total)}</strong></p>

                <button class="small danger"
                  onclick="deleteArchiveOrder(${index})">
                  Удалить из архива
                </button>
              </div>
            </details>
          `;
        }).join("")}
      `;
    }

    function deleteArchiveOrder(index) {
      if (!confirm("Удалить заказ из архива?")) return;

      state.archive.splice(index, 1);
      save();
      render();
    }

    function render() {
      document.querySelectorAll("nav button").forEach(button => {
        button.classList.remove("active");
      });

      const activeButton = document.getElementById("nav-" + view);

      if (activeButton) {
        activeButton.classList.add("active");
      }

      const app = document.getElementById("app");

      if (view === "tables") {
        app.innerHTML = renderTables();
      } else if (view === "menu") {
        app.innerHTML = renderMenu();
      } else {
        app.innerHTML = renderArchive();
      }
    }

    // ==========================================
    // УПРАВЛЕНИЕ МОБИЛЬНОЙ КЛАВИАТУРОЙ
    // ==========================================

    const keyboardDone = document.getElementById("keyboardDone");

    // Показываем кнопку при выборе поля ввода
    document.addEventListener("focusin", function(event) {
      if (
        event.target.matches("input, textarea") &&
        window.innerWidth <= 760
      ) {
        document.body.classList.add("keyboard-open");
      }
    });

    // Скрываем кнопку после потери фокуса
    document.addEventListener("focusout", function(event) {
      if (event.target.matches("input, textarea")) {
        setTimeout(() => {
          const active = document.activeElement;

          if (!active || !active.matches("input, textarea")) {
            document.body.classList.remove("keyboard-open");
          }
        }, 100);
      }
    });

    // Закрываем клавиатуру по нажатию на кнопку
    keyboardDone.addEventListener("pointerdown", function(event) {
      event.preventDefault();

      if (document.activeElement) {
        document.activeElement.blur();
      }

      document.body.classList.remove("keyboard-open");
    });

    // Запуск приложения
    render();
  </script>
</body>
</html>
